syntax = "proto3";

package gatekeeper.user.v1;

option go_package = "junglerider/gatekeeper/user/pb;userpb";

import "google/protobuf/struct.proto";

service AuthService {
  rpc Auth(AuthRequest) returns (AuthResponse);
}

message AuthRequest {
  string token = 1;
  string realm = 2;
}

message AuthResponse {
  google.protobuf.Struct claims = 1;
}
